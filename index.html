<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flip the Coin</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Flip the coin</h1>

      <h2>Press the coin or the button to flip the coin</h2>

      <div class="coin-container">
        <div class="coin pic">
          <img src="./resources/heads.svg" alt="" />
        </div>
        <div class="shadow"><img src="./resources/shadow.svg" alt="" /></div>
      </div>

      <p class="result">Heads</p>

      <button class="flip-button" type="button">RANDOM</button>
    </main>
    <script
      src="https://code.jquery.com/jquery-4.0.0.js"
      integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U="
      crossorigin="anonymous"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
